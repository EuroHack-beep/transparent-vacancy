x-report: &report
  build: .
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 512m
  pids_limit: 64
  user: "${REPORT_UID:-1000}:${REPORT_GID:-1000}"
  volumes:
    - type: bind
      source: ./reports
      target: /app/reports
      bind:
        create_host_path: false

services:
  report:
    <<: *report
    network_mode: none
  live:
    <<: *report
    profiles: [live]
    command: ["python", "run_report.py", "--output", "reports/report.json"]
    environment:
      VACANCY_SOURCE: "${VACANCY_SOURCE:-}"
      VACANCY_LIMIT: "${VACANCY_LIMIT:-}"
      VACANCY_TIMEOUT: "${VACANCY_TIMEOUT:-}"
      VACANCY_ALLOW_HTTP: "${VACANCY_ALLOW_HTTP:-}"
      VACANCY_ALLOWED_ORIGINS: "${VACANCY_ALLOWED_ORIGINS:-}"
      VACANCY_PRIVATE_ORIGINS: "${VACANCY_PRIVATE_ORIGINS:-}"
      VACANCY_MAX_PAGES: "${VACANCY_MAX_PAGES:-}"
      VACANCY_DEADLINE: "${VACANCY_DEADLINE:-}"
