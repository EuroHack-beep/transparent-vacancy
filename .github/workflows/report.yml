name: Vacancy report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Лимит уникальных вакансий для ручного запуска'
        type: string
        default: '4'
      source_url:
        description: 'URL источника (пусто — использовать настройки репозитория)'
        type: string
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: vacancy-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate vacancy report
        env:
          VACANCY_SOURCE: ${{ inputs.source_url || vars.VACANCY_SOURCE }}
          VACANCY_LIMIT: ${{ inputs.limit || vars.VACANCY_LIMIT }}
          VACANCY_TIMEOUT: ${{ vars.VACANCY_TIMEOUT }}
        run: python run_report.py --output report.json

      - name: Upload the vacancy report
        uses: actions/upload-artifact@v7
        with:
          name: vacancy-report
          path: report.json
          if-no-files-found: error
