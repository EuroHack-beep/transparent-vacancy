name: Vacancy report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Лимит уникальных вакансий для ручного запуска'
        type: string
        default: '4'
      source_url:
        description: 'URL источника (пусто — использовать настройки репозитория)'
        type: string
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: vacancy-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate vacancy report
        env:
          VACANCY_SOURCE: ${{ inputs.source_url || vars.VACANCY_SOURCE }}
          VACANCY_LIMIT: ${{ inputs.limit || vars.VACANCY_LIMIT }}
          VACANCY_TIMEOUT: ${{ vars.VACANCY_TIMEOUT }}
          VACANCY_ALLOW_HTTP: ${{ vars.VACANCY_ALLOW_HTTP }}
          VACANCY_ALLOWED_ORIGINS: ${{ vars.VACANCY_ALLOWED_ORIGINS }}
          VACANCY_MAX_PAGES: ${{ vars.VACANCY_MAX_PAGES }}
          VACANCY_DEADLINE: ${{ vars.VACANCY_DEADLINE }}
        run: python run_report.py --output report.json

      - name: Upload the vacancy report
        if: vars.VACANCY_PUBLISH_REPORT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vacancy-report
          path: report.json
          if-no-files-found: error
