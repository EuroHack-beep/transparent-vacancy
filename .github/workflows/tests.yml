name: Team tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run test suite
        run: python -m unittest -v

      - name: Generate and verify the sample report
        run: |
          python analyze_vacancies.py examples/vacancies.json --output report.json
          cmp report.json examples/report.json

      - name: Upload the verified sample report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: vacancy-report-sample
          path: report.json
          if-no-files-found: error
