name: Team tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run test suite
        run: python -m unittest -v

      - name: Generate and verify the sample report
        run: |
          python analyze_vacancies.py examples/vacancies.json --output report.json
          cmp report.json examples/report.json

      - name: Reproduce the editor demo
        run: |
          python analyze_vacancies.py examples/vacancies-corrected.json --output reports/after.json
          python compare_reports.py report.json reports/after.json --output reports/comparison.json
          python -c 'import json; s = json.load(open("reports/comparison.json"))["summary"]; assert s["resolved"] == 1 and s["added"] == s["changed"] == 0 and s["unchanged"] == 17'

      - name: Upload the verified sample report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vacancy-report-sample
          path: |
            report.json
            reports/comparison.json
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run the documented Docker command and verify its output
        run: |
          REPORT_UID="$(id -u)"
          REPORT_GID="$(id -g)"
          export REPORT_UID REPORT_GID
          docker compose -p vacancy-ci run --build --rm -T report
          cmp reports/sample-report.json examples/report.json
          docker compose -p vacancy-ci run --rm -T report \
            python analyze_vacancies.py examples/vacancies-corrected.json --output reports/after.json
          docker compose -p vacancy-ci run --rm -T report \
            python compare_reports.py reports/sample-report.json reports/after.json --output reports/comparison.json
          python3 -c 'import json; s = json.load(open("reports/comparison.json"))["summary"]; assert s["resolved"] == 1 and s["added"] == s["changed"] == 0'

      - name: Scan the image for high and critical vulnerabilities
        run: |
          docker save vacancy-ci-report -o "$RUNNER_TEMP/vacancy-ci.tar"
          docker run --rm -v "$RUNNER_TEMP/vacancy-ci.tar:/image.tar:ro" \
            aquasec/trivy:0.69.3 image --input /image.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 0

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Scan Git history
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --log-opts="--all" /repo

      - name: Scan application Python
        run: |
          python -m pip install bandit==1.9.2
          bandit --severity-level medium analyze_vacancies.py clarity_model.py compare_reports.py fetch_vacancies.py \
            report_storage.py run_report.py source_policy.py validation.py vacancy_checks.py vacancy_facts.py

      - name: Audit optional training dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements-train.txt
